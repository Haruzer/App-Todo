<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>タスク登録・編集</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        .card-wrapper { border-radius: 12px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .card-header-blue { background-color: #378ADD; color: white; padding: 16px 20px; font-size: 18px; font-weight: bold; }
        .card-body-custom { padding: 20px; background: white; }
        .required { color: #E24B4A; font-size: 12px; margin-left: 4px; }
        .optional { color: #888; font-size: 12px; margin-left: 4px; }
    </style>
</head>
<body class="bg-light">
<div class="container mt-4" style="max-width: 480px;">
    <div class="card-wrapper">
        <div class="card-header-blue">タスクを登録</div>
        <div class="card-body-custom">
            <form th:action="@{/tasks/save}" th:object="${task}" method="post">
                <input type="hidden" th:field="*{id}" />

                <div class="mb-3">
                    <label class="form-label">タスク名<span class="required">必須</span></label>
                    <input type="text" class="form-control" th:field="*{title}" placeholder="例：API実装" />
					<!-- エラーメッセージ（エラーがあるときだけ表示） -->
					<p class="text-danger" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></p>
                </div>

                <div class="mb-3">
                    <label class="form-label">内容・メモ<span class="optional">任意</span></label>
                    <textarea class="form-control" th:field="*{description}" rows="3" placeholder="詳細説明..."></textarea>
                </div>

                <div class="mb-3">
                    <label class="form-label">締切日<span class="optional">任意</span></label>
                    <input type="date" class="form-control" th:field="*{dueDate}" />
                </div>

                <div class="row mb-3">
                    <div class="col">
                        <label class="form-label">優先度</label>
                        <select class="form-select" th:field="*{priority}">
                            <option value="3">高</option>
                            <option value="2">中</option>
                            <option value="1">低</option>
                        </select>
                    </div>
                    <div class="col">
                        <label class="form-label">ステータス</label>
                        <select class="form-select" th:field="*{status}">
                            <option value="1">未完了</option>
                            <option value="2">完了</option>
                        </select>
                    </div>
                </div>

                <div class="d-flex gap-2 mt-4">
                    <a href="/tasks" class="btn btn-outline-secondary w-50">戻る</a>
                    <button type="submit" class="btn btn-primary w-50">OK</button>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
