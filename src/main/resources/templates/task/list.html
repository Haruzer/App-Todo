<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Todoリスト</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        .priority-high { background-color: #FCEBEB; color: #A32D2D; border-radius: 50%; width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: bold; }
        .priority-mid { background-color: #FAEEDA; color: #854F0B; border-radius: 50%; width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: bold; }
        .priority-low { background-color: #E1F5EE; color: #0F6E56; border-radius: 50%; width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: bold; }
        .task-card { border: 1px solid #e0e0e0; border-radius: 8px; padding: 12px 16px; margin-bottom: 8px; background: #faf9f7; display: flex; align-items: center; gap: 12px; }
        .task-title { flex: 1; font-size: 14px; }
        .task-date { font-size: 13px; color: #888; }
        .card-wrapper { border-radius: 12px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .card-header-blue { background-color: #378ADD; color: white; padding: 16px 20px; font-size: 18px; font-weight: bold; }
        .card-body-custom { padding: 16px; background: white; }
        .bottom-bar { display: flex; gap: 8px; margin-top: 12px; align-items: center; }
    </style>
</head>
<body class="bg-light">
<div class="container mt-4" style="max-width: 480px;">
    <div class="card-wrapper">
        <div class="card-header-blue">To-Do</div>
        <div class="card-body-custom">

            <div th:each="task : ${tasks}">
                <div class="task-card">
                    <div th:if="${task.priority == 3}" class="priority-high">高</div>
                    <div th:if="${task.priority == 2}" class="priority-mid">中</div>
                    <div th:if="${task.priority == 1}" class="priority-low">低</div>
                    <span class="task-title" th:text="${task.title}"></span>
                    <span class="task-date" th:text="${task.dueDate}"></span>
                    <a th:href="@{/tasks/edit/{id}(id=${task.id})}" class="btn btn-sm btn-outline-secondary py-1 px-2">✎</a>
                    <a th:href="@{/tasks/delete/{id}(id=${task.id})}" class="btn btn-sm btn-outline-secondary py-1 px-2">Del</a>
                </div>
            </div>

     		<form action="/tasks" method="get" class="bottom-bar">
			    <input type="text" name="keyword" class="form-control" placeholder="🔍 検索...">
			    <button type="submit" class="btn btn-outline-secondary text-nowrap">検索</button>
			    <a href="/tasks/new" class="btn btn-primary text-nowrap">＋ 追加</a>
			</form>
        </div>
    </div>
</div>
</body>
</html>
